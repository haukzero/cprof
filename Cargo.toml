[package]
name = "cprof"
version = "0.2.5"
edition = "2024"
rust-version = "1.88"
description = "A command-line profile manager for Claude Code and Codex configurations"
authors = ["haukzero <haukzero1@gmail.com>"]
license = "MIT"
repository = "https://github.com/haukzero/cprof"
readme = "README.md"
keywords = ["cli", "configuration", "profiles", "claude", "codex"]
categories = ["command-line-utilities"]

[dependencies]
clap = { version = "4.6.6", features = ["derive", "string"] }
colored = "3.1.1"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
dirs = "6.0.0"
indexmap = "2.14.1"
serde_json = "1.0.151"
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.11.0"
shell-words = "1.1.1"
thiserror = "2.0.20"
toml = "1.1.5"
unicode-width = "0.2.2"
zip = { version = "8.6.0", features = ["deflate"], default-features = false }

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Registry",
] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = "symbols"
panic = "abort"
